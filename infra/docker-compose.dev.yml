name: nestus-dev

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: nestus-postgres
    environment:
      POSTGRES_USER: nestus
      POSTGRES_PASSWORD: nestus
      POSTGRES_DB: nestus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestus -d nestus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nestus-dev

  redis:
    image: redis:7-alpine
    container_name: nestus-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nestus-dev

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: nestus-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nestus-dev

  grafana:
    image: grafana/grafana:11.5.2
    container_name: nestus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres
    networks:
      - nestus-dev

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:

networks:
  nestus-dev:
    name: nestus-dev
