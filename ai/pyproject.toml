[project]
name = "nestus-ai"
version = "0.1.0"
description = "NESTUS intelligence plane — evidence-based diagnosis and recovery proposals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nestus_ai"]

[dependency-groups]
dev = []

[tool.uv]
package = true
